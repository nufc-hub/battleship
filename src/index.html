<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer type="module" src="./index.js"></script>
    <link href="./styles/style.css" rel="stylesheet" type="text/css"></style>
    <link rel="stylesheet" href="./styles/normalize.css">
    <title>battleship</title>
  </head>
  <body>
    <h1 class="game-title">Battleship</h1>
    <div id="boards" class="boards">
      <div class="left-side">
        <h2 class="fleet-title">Your fleet</h2>
        <div id="humanBoard" class="board"></div>
      </div>
      <div class=" right-side">
        <h2 class="fleet-title">Enemy fleet</h2>
        <div id="computerBoard" class="board"></div>
      </div>
    </div>
    <div id="gameOverDiv" class="game-over-overlay">
      <p class="game-over-text">Game Over</p>
      <button class="new-game-button">New Game</button>
    </div>
    <div id="placeShipsRandomlyDiv"><button id="placeShipsRandomlyButton" class="place-ships-randomly-button">place ships randomly</button></div>
  </body>
</html>
