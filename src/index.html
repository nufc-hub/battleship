<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer type="module" src="./index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link href="./styles/style.css" rel="stylesheet" type="text/css"></style>
    <link rel="stylesheet" href="./styles/normalize.css">
    <title>battleship</title>
  </head>
  <body>
    <h1 class="game-title">Battleship</h1>
    <div id="boards" class="boards">
      <div class="left-side">
        <h2 class="fleet-title">Your fleet</h2>
        <div id="placeShipsRandomlyDiv" class="place-ships-randomly-button-div"><button id="placeShipsRandomlyButton" class="place-ships-randomly-button">Deploy Fleet</button></div>
        <div id="humanBoard" class="board"></div>
      </div>
      <div class=" right-side">
        <h2 class="fleet-title">Enemy fleet</h2>
        <div id="computerBoard" class="board"></div>
      </div>
    </div>
    <div id="placeShipsRandomlyDiv" class="place-ships-randomly-button-div"><button id="placeShipsRandomlyButton" class="place-ships-randomly-button">Deploy Fleet</button></div>
    <div id="gameOverDiv" class="game-over-overlay">
      <div class="game-over-content">      
        <p id="gameOverText" class="game-over-text"></p>
        <button class="new-game-button">New Game</button>
      </div>
    </div>
  </body>
</html>
